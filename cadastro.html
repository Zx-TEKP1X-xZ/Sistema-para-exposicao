<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA DE ESTOQUE // CADASTRO</title>
    <!-- Link para o arquivo CSS que você já tem -->
    <link rel="stylesheet" href="style.css">
    <script defer src="cadastro.js"></script>
</head>
<body>
    <div class="atom-container">
        <header>
            <div>
                <h1>MÓDULO DE CADASTRO</h1>
                <p style="font-size: 0.9rem; color: #a89f91; letter-spacing: 1px;">INSERÇÃO DE NOVOS ITENS NO BANCO DE DADOS</p>
            </div>
            <div class="sys-info">
                <p>FOZ DO IGUAÇU // 2076</p>
                <p id="clock">00:00:00</p>
            </div>
        </header>

        <main class="form-container">
            <form id="form-cadastro">
                <div class="form-group">
                    <label for="codigo_barras">CÓDIGO DE BARRAS</label>
                    <input type="text" id="codigo_barras" required autofocus autocomplete="off" placeholder="Bipe o código ou digite...">
                </div>
                
                <div class="form-group">
                    <label for="nome">NOME DO PRODUTO</label>
                    <input type="text" id="nome" required autocomplete="off" placeholder="Ex: Caderno Van Gogh">
                </div>

                <div class="form-grid-2">
                    <div class="form-group">
                        <label for="quantidade">QUANTIDADE INICIAL</label>
                        <input type="number" id="quantidade" required min="0" placeholder="0">
                    </div>

                    <div class="form-group">
                        <label for="preco">PREÇO DE VENDA (R$)</label>
                        <input type="number" id="preco" required min="0" step="0.01" placeholder="0.00">
                    </div>
                </div>

                <div class="action-buttons">
                    <button type="button" class="btn-voltar" onclick="window.location.href='index.html'">[ ESC ] VOLTAR</button>
                    <button type="submit" class="btn-salvar">[ ENTER ] SALVAR PRODUTO</button>
                </div>
            </form>
        </main>

        <footer>
            <span id="status-log">:: AGUARDANDO ENTRADA DE DADOS <span class="blink">■</span></span>
            <span>MODO DE INSERÇÃO</span>
        </footer>
    </div>
</body>
</html>
