<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDIÇÃO - SISTEMA DE CAIXA</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="form.css">
    <script defer src="edicao.js"></script>

</head>
<body>
    <div class="atom-container">
        <header>
            <div>
                <h1>MÓDULO DE EDIÇÃO</h1>
                <p style="font-size: 0.9rem; color: #a89f91; letter-spacing: 1px;">ACESSO E MANUTENÇÃO DO BANCO DE DADOS</p>
            </div>
            <div class="sys-info">
                <p>FOZ DO IGUAÇU // 2026</p>
                <p id="clock">00:00:00</p>
            </div>
        </header>

        <main class="form-container">
            <!-- Barra de Busca -->
            <div class="search-section">
                <div class="form-group" style="flex: 1; margin-bottom: 0;">
                    <label for="busca_codigo">LOCALIZAR PRODUTO (CÓDIGO DE BARRAS)</label>
                    <input type="text" id="busca_codigo" autofocus autocomplete="off" placeholder="Bipe o código para buscar...">
                </div>
                <button type="button" class="btn-buscar" onclick="buscarProduto()">[ ENTER ] BUSCAR</button>
            </div>

            <hr class="atom-divider">

            <!-- Formulário de Edição (Inicia desabilitado) -->
            <form id="form-edicao" style="opacity: 0.5; pointer-events: none;">
                <div class="form-group">
                    <label for="nome_edit">NOME DO PRODUTO</label>
                    <input type="text" id="nome_edit" required autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="categoria_edit">CATEGORIA</label>
                    <input type="text" id="categoria_edit" placeholder="Ex: CÓPIAS, PLASTIFICAÇÃO..." autocomplete="off">
                </div>

                <!-- Grid com 3 Colunas: Estoque, Custo e Preço de Venda -->
                <div class="form-grid-3">
                    <div class="form-group">
                        <label for="quantidade_edit">ESTOQUE</label>
                        <input type="number" id="quantidade_edit" required min="0">
                    </div>

                    <div class="form-group">
                        <label for="custo_edit">CUSTO (R$)</label>
                        <input type="number" id="custo_edit" required min="0" step="0.01" placeholder="0.00">
                    </div>

                    <div class="form-group">
                        <label for="preco_edit">PREÇO VENDA (R$)</label>
                        <input type="number" id="preco_edit" required min="0" step="0.01" placeholder="0.00">
                    </div>
                </div>

                <div class="action-buttons">
                    <button type="button" class="btn-voltar" onclick="window.location.href='index.html'">[ ESC ] VOLTAR</button>
                    <button type="button" class="btn-excluir" id="btn-excluir">[ DEL ] EXCLUIR PRODUTO</button>
                    <button type="submit" class="btn-salvar" id="btn-atualizar">[ F4 ] ATUALIZAR DADOS</button>
                </div>
            </form>
        </main>

        <footer>
            <span id="status-log">:: MODO DE MANUTENÇÃO // AGUARDANDO BUSCA <span class="blink">■</span></span>
            <span>ACESSO AUTORIZADO</span>
        </footer>
    </div>
    <div id="modal-alerta" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <div class="modal-header">
                <span class="modal-title">:: AVISO DO SISTEMA</span>
                <button class="btn-fechar-modal" onclick="fecharAlerta()">X</button>
            </div>
            <div class="modal-body">
                <p id="alerta-mensagem">Mensagem aqui...</p>
            </div>
            <div class="modal-footer">
                <button class="btn-modal-ok" onclick="fecharAlerta()">[ ENTER ] OK</button>
            </div>
        </div>
    </div>

    <div id="modal-confirmacao" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <div class="modal-header">
                <span class="modal-title">:: CONFIRMAÇÃO DO SISTEMA</span>
                <button type="button" class="btn-fechar-modal" onclick="fecharModalConfirmacao(false)">X</button>
            </div>
            <div class="modal-body">
                <p id="confirm-mensagem">Tem certeza de que deseja realizar esta ação?</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-secondary" onclick="fecharModalConfirmacao(false)">[ ESC ] CANCELAR</button>
                <button type="button" class="btn-confirm" id="btn-modal-sim">[ ENTER ] CONFIRMAR</button>
            </div>
        </div>
    </div>
</body>
</html>
