<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA DE ESTOQUE // TERMINAL CAIXA</title>
    <link rel="stylesheet" href="style.css">
    <script src="baixa.js"></script>
</head>
<body>
    <div class="atom-container">
        <header>
            <div>
                <h1>TERMINAL DE CAIXA</h1>
                <p style="font-size: 0.9rem; color: #a89f91; letter-spacing: 1px;">BAIXA RÁPIDA DE PRODUTOS E AJUSTE DE VALORES</p>
            </div>
            <div class="sys-info">
                <p>FOZ DO IGUAÇU // 2026</p>
                <p id="clock">00:00:00</p>
            </div>
        </header>

        <main class="form-container">
            <!-- BUSCA AUTOMÁTICA VIA LEITOR -->
            <div class="search-section">
                <div class="form-group" style="flex: 1; margin-bottom: 0;">
                    <label for="codigo_barras_baixa">CÓDIGO DE BARRAS (BIPE AQUI)</label>
                    <input type="text" id="codigo_barras_baixa" autofocus autocomplete="off" placeholder="Aguardando bip do leitor...">
                </div>
                <button type="button" class="btn-buscar" onclick="buscarParaBaixa()">[ ENTER ] CONSULTAR</button>
            </div>

            <hr class="atom-divider">

            <!-- PAINEL DE PROCESSAMENTO DA BAIXA -->
            <form id="form-baixa" style="opacity: 0.5; pointer-events: none;">
                <div class="form-group">
                    <label for="nome_baixa">PRODUTO LOCALIZADO</label>
                    <input type="text" id="nome_baixa" readonly tabindex="-1" style="background-color: #0d0c0e; color: var(--atom-gold);">
                </div>

                <!-- ABAS DE DESCONTO RÁPIDO -->
                <div class="desconto-tags-container">
                    <label style="font-size: 0.9rem; color: var(--atom-terracotta); font-weight: bold;">ATALHOS DE DESCONTO:</label>
                    <div class="desconto-tags">
                        <button type="button" class="tag-desc" onclick="aplicarDescontoRapido(0)">0%</button>
                        <button type="button" class="tag-desc" onclick="aplicarDescontoRapido(5)">5%</button>
                        <button type="button" class="tag-desc" onclick="aplicarDescontoRapido(10)">10%</button>
                        <button type="button" class="tag-desc" onclick="aplicarDescontoRapido(15)">15%</button>
                        <button type="button" class="tag-desc" onclick="aplicarDescontoRapido(20)">20%</button>
                    </div>
                </div>

                <div class="form-grid-2">
                    <div class="form-group">
                        <label for="quantidade_baixa">QTD. SAÍDA</label>
                        <input type="number" id="quantidade_baixa" value="1" min="1" required oninput="calcularValores('qtd')">
                    </div>

                    <div class="form-group">
                        <label for="desconto_porcentagem">% DESCONTO</label>
                        <input type="number" id="desconto_porcentagem" value="0" min="0" max="100" step="0.1" oninput="calcularValores('porcentagem')">
                    </div>
                </div>

                <div class="form-grid-2">
                    <div class="form-group">
                        <label for="preco_original">PREÇO ORIGINAL (R$)</label>
                        <input type="number" id="preco_original" readonly tabindex="-1" style="background-color: #0d0c0e; color: #8c858f;">
                    </div>

                    <div class="form-group">
                        <label for="preco_final">PREÇO DE VENDA (R$)</label>
                        <input type="number" id="preco_final" required min="0" step="0.01" oninput="calcularValores('preco')">
                    </div>
                </div>

                <div class="action-buttons">
                    <button type="button" class="btn-voltar" onclick="window.location.href='index.html'">[ ESC ] CANCELAR</button>
                    <button type="submit" class="btn-salvar" id="btn-confirmar-baixa">[ ENTER ] CONFIRMAR BAIXA</button>
                </div>
            </form>
        </main>

        <footer>
            <span id="status-log">:: AGUARDANDO BIPE NO LEITOR <span class="blink">■</span></span>
            <span>MODO DE SAÍDA</span>
        </footer>
    </div>

    
</body>
</html>
